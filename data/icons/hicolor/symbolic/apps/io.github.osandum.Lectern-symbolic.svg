<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Symbolic variant: one flat colour, replaced by the theme at use
       time, so shape alone carries the meaning.

       Two things this needs that the colour icon also needed. The page is
       PORTRAIT: landscape plus a stand reads as a laptop at this size.
       And the page is an OUTLINE rather than a filled slab; drawn solid
       it merges into the stand below and the separation is lost. One
       interior rule is all that survives 16px, so there is only one. -->
  <g fill="#222222">
    <g transform="rotate(-8 8 6)">
      <rect x="4.6" y="1.4" width="7.2" height="8.2" rx="1"
            fill="none" stroke="#222222" stroke-width="1.25"/>
      <rect x="6.3" y="4.4" width="3.8" height="1.15" rx="0.57"/>
      <rect x="1.9" y="9.4" width="12.2" height="1.85" rx="0.92"/>
    </g>
    <path d="M6.5 11.4 L9.5 11.4 L10.9 13.8 L5.1 13.8 Z"/>
    <rect x="4.1" y="13.3" width="7.8" height="1.55" rx="0.77"/>
  </g>
</svg>
