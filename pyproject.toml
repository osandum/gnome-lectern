[project]
name = "mdview"
version = "0.1.0"
description = "A read-only, Papers-style GTK4/Libadwaita Markdown viewer"
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.46",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
mdview = "mdview.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mdview*"]
