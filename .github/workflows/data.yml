name: Data files

# Cheap checks over the things that ship alongside the code and that the
# test suite can't see. Both categories here have already broken once:
# an SVG with `--` inside an XML comment (illegal, and the `--`-as-dash
# style used elsewhere in this codebase invites it), and a desktop entry
# whose Icon= named an icon that nothing installed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils librsvg2-bin appstream

      - name: Desktop entry is valid
        run: desktop-file-validate data/*.desktop

      # Flathub rejects invalid metainfo outright, so catching it here beats
      # catching it at submission. Screenshot URLs point at raw.github, so
      # this also fails if a screenshot is renamed without updating them.
      - name: AppStream metainfo is valid
        run: appstreamcli validate --explain data/*.metainfo.xml

      - name: Flatpak manifest parses and stays in sync with the app ID
        run: |
          python3 - <<'PY'
          import glob, yaml
          path = "build-aux/io.github.osandum.Lectern.yml"
          m = yaml.safe_load(open(path))
          desktop = glob.glob("data/*.desktop")[0].split("/")[-1][: -len(".desktop")]
          assert m["id"] == desktop, f'manifest id {m["id"]} != desktop entry {desktop}'
          assert m["command"], "manifest has no command"
          for mod in m["modules"]:
              for src in mod.get("sources", []):
                  t = src.get("type")
                  if t == "file":
                      assert src.get("sha256"), f'unpinned source: {src.get("url")}'
                  elif t == "git":
                      # Flathub requires immutable sources: a tag can be
                      # moved, so the commit has to be pinned as well.
                      assert src.get("commit"), f'git source without a commit: {src.get("url")}'
                  elif t == "dir":
                      raise AssertionError(
                          "manifest has a 'dir' source; Flathub needs an immutable "
                          "source. Fine while developing, not on main."
                      )
          print(f"{path}: ok, id={m['id']}, runtime {m['runtime']} {m['runtime-version']}")
          PY

      - name: SVGs are well-formed XML
        run: |
          shopt -s globstar nullglob
          for f in data/**/*.svg tests/fixtures/**/*.svg; do
            python3 -c "import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" "$f"
            echo "well-formed: $f"
          done

      - name: SVGs render through librsvg
        run: |
          shopt -s globstar nullglob
          for f in data/**/*.svg tests/fixtures/**/*.svg; do
            # A real file, not /dev/null: rsvg-convert rejects a
            # non-regular output target outright.
            rsvg-convert -w 128 -h 128 "$f" -o "$(mktemp --suffix=.png)"
            echo "renders: $f"
          done

      # Icon= names a *themed* icon, not a path, so a typo or a missing
      # file shows up only as a blank tile on someone else's machine.
      - name: Desktop entry's Icon= is actually shipped
        run: |
          icon=$(grep -h '^Icon=' data/*.desktop | cut -d= -f2-)
          test -n "$icon" || { echo "no Icon= in the desktop entry"; exit 1; }
          if find data/icons -name "$icon.svg" -print -quit | grep -q .; then
            echo "Icon=$icon is shipped"
          else
            echo "Icon=$icon has no matching file under data/icons/"
            exit 1
          fi
